rcle%20cx=%2224%22%20cy=%2224%22%20r=%2218%22/%3E%3Cpath%20d=%22m24%2016%207%205-3%208h-8l-3-8zM24%206v10M31%2021l9-5M28%2029l6%209M20%2029l-6%209M17%2021l-9-5%22/%3E%3C/g%3E%3Cg%20transform=%22translate(20%20280)%20rotate(12%2024%2024)%20scale(0.9)%22%3E%3Crect%20x=%2217%22%20y=%2226%22%20width=%2214%22%20height=%2218%22%20rx=%222%22/%3E%3Cpath%20d=%22M19%2026V16l10-7v17%22/%3E%3C/g%3E%3Cg%20transform=%22translate(120%20300)%20rotate(-3%2024%2024)%20scale(1.05)%22%3E%3Crect%20x=%229%22%20y=%229%22%20width=%2230%22%20height=%2221%22%20rx=%222%22/%3E%3Cpath%20d=%22M3%2034h42l-3%205H6z%22/%3E%3C/g%3E%3Cg%20transform=%22translate(250%20290)%20rotate(8%2024%2024)%20scale(0.95)%22%3E%3Cpath%20d=%22M24%2015c-4-4-15-3-15%209%200%209%206%2018%2010%2018%202%200%203-1%205-1s3%201%205%201c4%200%2010-9%2010-18%200-12-11-13-15-9z%22/%3E%3Cpath%20d=%22M24%2015c0-5%203-8%207-9%22/%3E%3C/g%3E%3Cg%20transform=%22translate(380%20270)%20rotate(-14%2024%2024)%20scale(1.0)%22%3E%3Cpath%20d=%22M24%204%2037%2020%2024%2040%2011%2020z%22/%3E%3Cpath%20d=%22M24%204v36M11%2020h26M24%2040c3%202-3%204%200%206%22/%3E%3C/g%3E%3Cg%20transform=%22translate(70%20400)%20rotate(0%2024%2024)%20scale(0.9)%22%3E%3Ccircle%20cx=%2224%22%20cy=%2224%22%20r=%2218%22/%3E%3Ccircle%20cx=%2224%22%20cy=%2224%22%20r=%225%22/%3E%3Cpath%20d=%22M24%2019V6M19.7%2026.5%208.6%2033M28.3%2026.5%2039.4%2033%22/%3E%3C/g%3E%3Cg%20transform=%22translate(190%20410)%20rotate(-6%2024%2024)%20scale(1.0)%22%3E%3Cpath%20d=%22M8%2019h32l-3%2024H11z%22/%3E%3Cpath%20d=%22M17%2019v-4a7%207%200%200%201%2014%200v4%22/%3E%3C/g%3E%3Cg%20transform=%22translate(300%20400)%20rotate(20%2024%2024)%20scale(0.95)%22%3E%3Crect%20x=%227%22%20y=%2216%22%20width=%227%22%20height=%2216%22%20rx=%222%22/%3E%3Crect%20x=%2234%22%20y=%2216%22%20width=%227%22%20height=%2216%22%20rx=%222%22/%3E%3Cpath%20d=%22M14%2024h20M3%2020v8M45%2020v8%22/%3E%3C/g%3E%3Cg%20transform=%22translate(420%20390)%20rotate(-10%2024%2024)%20scale(0.95)%22%3E%3Crect%20x=%2214%22%20y=%224%22%20width=%2220%22%20height=%2240%22%20rx=%224%22/%3E%3Cpath%20d=%22M21%2038h6%22/%3E%3C/g%3E%3Cg%20transform=%22translate(440%20180)%20rotate(6%2024%2024)%20scale(0.85)%22%3E%3Cpath%20d=%22M8%2020h32v13a9%209%200%200%201-9%209H17a9%209%200%200%201-9-9z%22/%3E%3Cpath%20d=%22M3%2023h5M40%2023h5M20%2014h8M24%2014v-4%22/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"); --sketch-opacity: .10; }
body::before, body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; }
body::before { background: var(--wash); }
body::after { background-image: var(--sketch); background-size: 480px 480px; opacity: var(--sketch-opacity); }
@media print { body::before, body::after { display: none; } }
body { margin: 0; background: var(--page); color: var(--ink); font: 400 15px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px; }
@media (max-width: 640px) { .wrap { padding: 0 16px; } }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Top bar ---------- */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--page) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.top-row { display: flex; align-items: center; gap: 16px; padding-top: 14px; padding-bottom: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand b { font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
.brand span { color: var(--ink-2); font-size: 14px; }
.asof { font-size: 14px; color: var(--ink-2); }
.asof strong { color: var(--ink); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 5px 12px 5px 10px; font-size: 13px; font-weight: 600; cursor: pointer; }
.pill .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); box-shadow: 0 0 0 2px var(--surface); }
.pill.green .dot { background: var(--good); }
.pill.amber .dot { background: var(--warning); }
.pill.red .dot { background: var(--critical); }
.source { font-size: 12px; color: var(--muted); }
.theme-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; width: 32px; height: 32px; cursor: pointer; display: grid; place-items: center; }
.navbar { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
.navbar::-webkit-scrollbar { display: none; }
.navbar a { flex: none; text-decoration: none; color: var(--ink-2); font-size: 14px; font-weight: 500; padding: 6px 12px; border-radius: 999px; }
.navbar a:hover { background: var(--accent-wash); color: var(--ink); }
.navbar a.on { background: var(--ink); color: var(--page); }

/* Health panel */
.pill { text-decoration: none; color: var(--ink); }
.pill.install { background: var(--ink); color: var(--page); border-color: transparent; }
.pill.checking .dot { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .pill.checking .dot { animation: none; } }
@media (max-width: 640px) { .brand span { display: none; } .asof { order: 3; width: 100%; font-size: 13px; } .top-row { gap: 10px; } }
.health-panel { border-top: 1px solid var(--border); padding: 12px 0 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 6px 24px; font-size: 13px; }
.health-panel[hidden] { display: none; }
.check { display: flex; gap: 8px; align-items: flex-start; }
.check i { font-style: normal; font-weight: 700; width: 16px; flex: none; }
.check.pass i { color: var(--text-good); }
.check.fail i { color: var(--text-warn); }
.check small { display: block; color: var(--muted); }

/* ---------- Layout blocks ---------- */
main { padding: 28px 0 40px; }
section.block { padding: 28px 0 8px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin: 0 0 14px; }
.sec-head h2 { font: 600 24px/1.2 var(--font-note); margin: 0; letter-spacing: -0.005em; }
.sec-head p { margin: 0; color: var(--muted); font-size: 13px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-wide { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
@media (max-width: 980px) { .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g-wide { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 700px) { .g2, .g3 { grid-template-columns: minmax(0, 1fr); } }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 18px 14px; min-width: 0; }
.card h3 { margin: 0; font-size: 15px; font-weight: 600; }
.card .takeaway { margin: 4px 0 14px; color: var(--ink-2); font-size: 13.5px; }
.card-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.link-btn { white-space: nowrap; flex: none; background: none; border: 0; padding: 4px 0; color: var(--accent); font-size: 12.5px; font-weight: 600; cursor: pointer; }
.unavailable { color: var(--muted); font-size: 13.5px; padding: 12px 0; }

/* ---------- Today: the written brief ---------- */
.dateline { font-size: 14px; color: var(--ink-2); margin: 0 0 8px; }
.note { font: 400 clamp(19px, 1.9vw, 23px)/1.45 var(--font-note); margin: 0 0 6px; max-width: 34em; letter-spacing: -0.005em; }
.note b { font-weight: 600; }
.today-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2.1fr); gap: 16px; align-items: start; }
@media (max-width: 980px) { .today-grid { grid-template-columns: minmax(0, 1fr); } }
.watch { list-style: none; margin: 0; padding: 0; }
.watch li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 10px 0; border-top: 1px solid var(--grid); font-size: 14px; }
.watch li:first-child { border-top: 0; padding-top: 2px; }
.watch .ico { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; margin-top: 1px; }
.watch .bad .ico { background: var(--critical); }
.watch .warn .ico { background: var(--warning); color: #3a2a00; }
.watch .good .ico { background: var(--good); }
.watch .area { display: block; font-size: 12px; color: var(--muted); }

/* ---------- Stat tiles ---------- */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.tiles.t4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tiles.t6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
@media (max-width: 1100px) { .tiles.t6 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 860px) { .tiles.t4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .tiles, .tiles.t6 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { padding: 16px 16px 14px; border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); margin: 0 -1px -1px 0; min-width: 0; }
.tile .lbl { font-size: 13px; color: var(--ink-2); }
.tile .val { font-size: 26px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.2; margin: 4px 0 6px; white-space: nowrap; }
.tile .val small { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 2px; }
.tile .d { font-size: 12.5px; line-height: 1.45; color: var(--muted); }
.tile .d b { font-weight: 600; }
.up-good, .down-good { color: var(--text-good); }
.up-bad, .down-bad { color: var(--text-bad); }
.flat { color: var(--ink-2); }
.tile svg.spark { display: block; margin-top: 8px; width: 100%; height: 30px; }
@media (max-width: 640px) { .tile .val { font-size: 22px; } }

/* ---------- Charts ---------- */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); margin: -4px 0 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.key-line { width: 14px; height: 2px; border-radius: 2px; display: inline-block; }
.key-dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.hb { display: grid; gap: 2px; }
.hb-row { display: grid; grid-template-columns: minmax(84px, 9.5rem) minmax(0, 1fr) 4.6rem 4rem; align-items: center; gap: 10px; padding: 4px 6px; margin: 0 -6px; border-radius: 6px; font-size: 13.5px; }
.hb-row:hover, .hb-row:focus-visible { background: var(--accent-wash); }
.hb-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
.hb-track { height: 14px; position: relative; }
.hb-bar { position: absolute; top: 0; height: 14px; border-radius: 0 4px 4px 0; background: var(--s1); }
.hb-val { text-align: right; font-weight: 600; }
.hb-sub { text-align: right; font-size: 12.5px; }
.hb.nosub .hb-row { grid-template-columns: minmax(84px, 9.5rem) minmax(0, 1fr) 4.6rem; }
@media (max-width: 640px) { .hb-row { grid-template-columns: minmax(70px, 7rem) minmax(0, 1fr) 4.2rem 3.4rem; gap: 8px; font-size: 13px; } .hb.nosub .hb-row { grid-template-columns: minmax(70px, 7rem) minmax(0, 1fr) 4.2rem; } }
.hb.stacked .hb-row { grid-template-columns: minmax(0, 1fr) auto 3.6rem; grid-template-areas: "l v s" "t t t"; row-gap: 5px; padding: 6px; }
.hb.stacked.nosub .hb-row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "l v" "t t"; }
.hb.stacked .hb-label { grid-area: l; } .hb.stacked .hb-val { grid-area: v; } .hb.stacked .hb-sub { grid-area: s; }
.hb.stacked .hb-track { grid-area: t; height: 10px; } .hb.stacked .hb-bar { height: 10px; }
@media (max-width: 640px) {
  .hb:not(.wf) .hb-row { grid-template-columns: minmax(0, 1fr) auto 3.6rem; grid-template-areas: "l v s" "t t t"; row-gap: 5px; padding: 6px; }
  .hb.nosub:not(.wf) .hb-row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "l v" "t t"; }
  .hb:not(.wf) .hb-label { grid-area: l; } .hb:not(.wf) .hb-val { grid-area: v; } .hb:not(.wf) .hb-sub { grid-area: s; }
  .hb:not(.wf) .hb-track { grid-area: t; height: 10px; } .hb:not(.wf) .hb-bar { height: 10px; }
}
.cat-ico { display: inline-block; vertical-align: -3px; margin-right: 7px; fill: none; stroke: var(--ink-2); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.axis-text { fill: var(--muted); font-size: 11px; font-family: var(--font-ui); font-variant-numeric: tabular-nums; }
.stack { display: flex; gap: 2px; height: 18px; border-radius: 4px; overflow: hidden; margin: 6px 0 12px; }
.stack div { height: 100%; }
.stack-legend { display: grid; gap: 6px; font-size: 13.5px; }
.stack-legend div { display: grid; grid-template-columns: 14px 1fr auto auto; gap: 8px; align-items: center; }
.tbl-wrap { overflow-x: auto; margin-top: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; }
th { font-weight: 600; color: var(--ink-2); font-size: 12px; }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12); max-width: 260px; }
.tip[hidden] { display: none; }
.tip .t-h { font-weight: 600; margin-bottom: 4px; }
.tip .t-r { display: flex; justify-content: space-between; gap: 14px; }
.tip .t-r span:first-child { color: var(--ink-2); }
.tip .t-r b { font-weight: 600; font-variant-numeric: tabular-nums; }

/* Waterfall */
.wf .hb-bar.total { background: var(--s1-deep); border-radius: 0 4px 4px 0; }
.wf .hb-bar.plus { background: var(--s1-soft); border-radius: 4px; }
.wf .hb-bar.minus { background: var(--neg); border-radius: 4px; }

/* ---------- Ask the analyst ---------- */
.ask { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px; }
.ask-form { display: flex; gap: 10px; }
.ask-form input { flex: 1; min-width: 0; border: 1px solid var(--axis); background: var(--page); border-radius: 10px; padding: 12px 14px; font-size: 16px; }
.ask-form input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.ask-form button { border: 0; background: var(--ink); color: var(--page); border-radius: 10px; padding: 0 18px; font-weight: 600; cursor: pointer; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
.chip { border: 1px solid var(--border); background: var(--page); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; color: var(--ink-2); }
.chip:hover { color: var(--ink); border-color: var(--axis); }
.thread { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; margin-top: 18px; }
.qa { min-width: 0; }
.qa { border-top: 1px solid var(--grid); padding-top: 14px; }
.qa .q { font-weight: 600; margin: 0 0 6px; }
.qa .a { font: 400 19px/1.45 var(--font-note); margin: 0 0 8px; max-width: 46em; }
.qa ul { margin: 6px 0 8px; padding-left: 18px; font-size: 14px; max-width: 46em; }
.qa details { font-size: 13px; color: var(--ink-2); }
.qa details summary { cursor: pointer; color: var(--accent); font-weight: 600; }
.qa details ol { margin: 6px 0 0; padding-left: 18px; }
.qa .asof-line { font-size: 12px; color: var(--muted); margin-top: 6px; }

/* ---------- Method ---------- */
.card.method { max-width: 900px; padding: 0; }
.card.method summary { list-style: none; cursor: pointer; padding: 16px 18px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--accent); }
.card.method summary::-webkit-details-marker { display: none; }
.card.method summary::after { content: '▾'; margin-left: auto; color: var(--muted); font-weight: 400; }
.card.method[open] summary::after { content: '▴'; }
.card.method .m-close, .card.method[open] .m-open { display: none; }
.card.method[open] .m-close { display: inline; }
.card.method > *:not(summary) { margin-left: 18px; margin-right: 18px; }
.card.method > *:last-child { margin-bottom: 16px; }
.method p, .method li { font-size: 14px; color: var(--ink-2); max-width: 70ch; }
.method h3 { font-size: 15px; margin: 18px 0 6px; }
.notes { margin: 0; padding-left: 18px; }

/* ---------- Proof ---------- */
.decide { display: block; margin-top: 4px; font-size: 12.5px; color: var(--ink-2); }

.sql-list .verified b { color: var(--text-good); }
.drills { list-style: none; margin: 0; padding: 0; }
.drills li { display: grid; gap: 2px; padding: 9px 0; border-top: 1px solid var(--grid); font-size: 13.5px; color: var(--ink-2); }
.drills li:first-child { border-top: 0; padding-top: 0; }
.drills b { color: var(--ink); font-weight: 600; }
.refuse li { font-size: 14px; color: var(--ink-2); margin-bottom: 8px; }
.dm svg { display: block; width: 100%; height: auto; }
.dm-box rect { fill: var(--surface); stroke: var(--axis); stroke-width: 1.2; }
.dm-box.core rect { fill: var(--accent-wash); stroke: var(--accent); stroke-width: 2; }
.dm-box.alone rect { stroke-dasharray: 4 4; }
.dm-name { font: 600 13px var(--font-ui); fill: var(--ink); }
.dm-sub { font: 11px var(--font-ui); fill: var(--muted); }
.dm-line { stroke: var(--axis); stroke-width: 1.6; fill: none; }
.dm-line.recon { stroke: var(--accent); stroke-dasharray: 6 4; }
.dm-line.broken { stroke: var(--critical); stroke-dasharray: 3 4; }
.dm-key { font: 11px var(--font-ui); fill: var(--ink-2); paint-order: stroke; stroke: var(--surface); stroke-width: 5px; stroke-linejoin: round; }
.dm-key.bad { fill: var(--text-bad); }
@media (max-width: 640px) { .dm { overflow-x: auto; } .dm svg { width: 640px; max-width: none; } }

/* ---------- Loading / errors ---------- */
.banner { margin: 16px 0 0; padding: 10px 14px; border-radius: 10px; font-size: 14px; background: var(--accent-wash); color: var(--ink); }
.banner.warn { background: color-mix(in srgb, var(--warning) 18%, transparent); }
.loading-note { padding: 80px 0; text-align: center; color: var(--ink-2); }

      return out(int(x.reorderSkus) + ' products need reordering in at least one warehouse. Total stock is worth ' + money(x.stockValue) + ', and ' + pct(s.Overstock ? s.Overstock.valuePct : 0, 0) + ' of that value is overstock.', {
        bullets: Object.keys(s).map(function (k) { return k + ': ' + int(s[k].rows) + ' product-warehouse lines, ' + money(s[k].value); }).concat([int(x.lowCoverRows) + ' lines have less than 7 days of stock left']),
        working: ['From the Inventory tab snapshot of ' + x.snapshotDate + ' (the team replaces this tab each day).'], asOf: asOf(B) });
    }
    if (m === 'support') {
      x = B.support; if (!x) return missing('Customer_Service', B);
      return out('Customers rated support ' + x.csat30 + ' out of 5 in the last 30 days (' + int(x.csatResponses30) + ' answers). Tickets took ' + x.medianResolutionHours30 + ' hours to close (median), and ' + x.openTickets + ' are open now. ' + int(x.tickets30) + ' tickets came in, ' + change(x.ticketsChangePct) + ' on the 30 days before; the top issue is ' + x.issues30[0].issue + '.' + note, {
        bullets: x.issues30.slice(0, 6).map(function (i) { return i.issue + ': ' + i.count + ' (' + pct(i.sharePct, 0) + ')'; }),
        working: ['Tickets by created date, last 30 days. Median is used for resolution time so a few very slow tickets don\'t distort it.', 'Tickets are not linked to sales, because their order numbers point to other customers (see How it works).'], asOf: asOf(B) });
    }
    if (m === 'reviews') {
      x = B.reviews; if (!x) return missing('Reviews', B);
      return out('Products averaged ' + x.avgRating90 + ' stars across ' + int(x.reviews90) + ' reviews in the last 90 days (' + x.prevAvgRating90 + ' in the 90 days before); ' + pct(x.negativePct90, 0) + ' of reviews were negative.' + note, { working: ['Average of the Rating column for reviews dated ' + addDays(D, -89) + ' to ' + D + '.'], asOf: asOf(B) });
    }
    if (m === 'customers') {
      x = B.customers;
      return out(int(x.active90) + ' customers bought in the last 90 days, and ' + pct(x.repeatPct90, 0) + ' of them had bought before. ' + int(x.new30) + ' new customers placed a first order in the last 30 days (' + change(rel(x.new30, x.newPrev30)) + ').' + note, { working: ['Active = placed at least one order that was not cancelled. Repeat = their first ever order came before this 90-day window.'], asOf: asOf(B) });
    }
    if (m === 'profit') {
      x = B.finance; if (!x) return missing('Finance_Monthly', B);
      var mo = x.lastFull;
      if (p && p.kind === 'month') { var hitM = x.months.filter(function (k) { return k.month === p.month; })[0]; if (hitM) mo = hitM; else return out('Finance numbers are available for ' + x.months[0].month + ' to ' + x.months[x.months.length - 1].month + '.', { asOf: asOf(B) }); }
      if (plan.dimType === 'country' || plan.dimType === 'region' || plan.op === 'breakdown' || plan.op === 'top' || plan.op === 'bottom') {
        var cs = x.countries.slice(); if (plan.op === 'bottom') cs.reverse();
        return out('In ' + monthName(x.lastFull.month) + ', the most profitable country was ' + x.countries[0].country + ' (EBITDA ' + money(x.countries[0].ebitda) + ') and the least was ' + x.countries[x.countries.length - 1].country + ' (' + money(x.countries[x.countries.length - 1].ebitda) + ').', {
          bullets: cs.map(function (c) { return c.country + ': EBITDA ' + money(c.ebitda) + ' on ' + money(c.revenue) + ' revenue (' + pct(c.ebitdaMarginPct) + ')'; }), working: ['From the Finance_Monthly tab for ' + x.lastFull.month + ', the last full month.'], asOf: asOf(B) });
      }
      if (/loss|negative|lost money/.test(plan.raw.toLowerCase())) {
        var neg = x.months.filter(function (k) { return k.ebitda < 0; });
        return out(neg.length ? 'EBITDA was negative in ' + neg.map(function (k) { return monthName(k.month) + ' (' + money(k.ebitda) + ')'; }).join(', ') + '. Every other month in the last 13 was positive.' : 'EBITDA was positive in every one of the last 13 months.', { working: ['EBITDA by month from the Finance_Monthly tab.'], asOf: asOf(B) });
      }
      return out('In ' + monthName(mo.month) + (mo.partial ? ' (part month)' : '') + ', EBITDA was ' + money(mo.ebitda) + ' on ' + money(mo.revenue) + ' revenue: a ' + pct(mo.ebitdaMarginPct) + ' margin. Over the last 12 full months, EBITDA was ' + money(x.last12Full.ebitda) + ' (' + pct(x.last12Full.ebitdaMarginPct) + ' of revenue).', {
        bullets: ['Gross profit: ' + money(mo.grossProfit) + ' (' + pct(mo.grossMarginPct) + ')', 'Marketing: ' + money(mo.marketing), 'Staff: ' + money(mo.staff), 'Rent and utilities: ' + money(mo.rent), 'Technology: ' + money(mo.technology), 'Fulfilment minus shipping income: ' + money(mo.fulfilment - mo.shippingIncome)],
        working: ['From the Finance_Monthly tab, added across all 12 countries.', 'EBITDA = gross profit + shipping income − fulfilment − marketing − staff − technology − rent.'], asOf: asOf(B) });
    }
    if (m === 'people') {
      x = B.people; if (!x) return missing('Employees_HR', B);
      if (plan.dimType === 'department' && plan.dimValue) { var dpt = x.byDepartment.filter(function (k) { return k.department === plan.dimValue; })[0]; return out(dpt.department + ' has ' + int(dpt.headcount) + ' active employees, ' + pct(dpt.sharePct) + ' of the company. ' + dpt.leavers12 + ' people left this team in the last 12 months.', { working: ['Counted employees with Status = Active in the Employees_HR tab.'], asOf: asOf(B) }); }
      if (/hir|attrition|left|leaver|turnover/.test(plan.raw.toLowerCase())) return out('In the last 12 months the company hired ' + int(x.hires12) + ' people and ' + int(x.leavers12) + ' left: attrition of ' + pct(x.attritionPct12) + ' and a net gain of ' + int(x.netChange12) + '.', { working: ['Hires by Hire_Date and leavers by Termination_Date, ' + addDays(D, -364) + ' to ' + D + '.', 'Attrition = leavers ÷ current active headcount.'], asOf: asOf(B) });
      return out('Apesv has ' + int(x.active) + ' active employees. The biggest team is ' + x.byDepartment[0].department + ' (' + int(x.byDepartment[0].headcount) + ', ' + pct(x.byDepartment[0].sharePct, 0) + ').', {
        bullets: x.byDepartment.map(function (k) { return k.department + ': ' + int(k.headcount); }), working: ['Counted employees with Status = Active in the Employees_HR tab, grouped by Department. No salaries or names are used.'], asOf: asOf(B) });
    }
    return askBack(B, plan);
  }

  function missing(tab, B) { return out('The ' + tab + ' tab could not be read this morning, so I won\'t answer from stale or partial data. The health light at the top shows the details.', { asOf: asOf(B) }); }

  function why(plan, B) {
    var D = B.dataDay, k = B.kpis.revenue, dir = k.vsNormalPct < 0 ? 'below' : 'above';
    var drivers = B.countries.map(function (c) { return { name: c.country, gap: c.revenue - c.normal }; });
    var gone = Object.keys(B.monthlyCountry[D.slice(0, 7)] || {}).filter(function (c) { return !B.countries.some(function (x) { return x.country === c; }); });
    drivers.sort(function (a, b) { return dir === 'below' ? a.gap - b.gap : b.gap - a.gap; });
    var top = drivers.slice(0, 3).filter(function (d) { return dir === 'below' ? d.gap < 0 : d.gap > 0; });
    var totalGap = k.value - k.normal;
    var ord = B.kpis.orders, aov = B.kpis.aov;
    var mix = (ord.vsNormalPct < 0 ? 'fewer orders (' + int(ord.value) + ' vs ' + ord.normal.toFixed(0) + ' normally)' : 'more orders (' + int(ord.value) + ' vs ' + ord.normal.toFixed(0) + ')') + ' and ' + (aov.vsNormalPct < 0 ? 'a smaller average order (' + money(aov.value) + ' vs ' + money(aov.normal) + ')' : 'a bigger average order (' + money(aov.value) + ' vs ' + money(aov.normal) + ')');
    return out('Revenue on ' + dayName(D) + ' was ' + money(k.value) + ', ' + money(Math.abs(totalGap)) + ' ' + dir + ' a normal day. It came from ' + mix + '. The biggest gaps by country were ' + top.map(function (d) { return d.name + ' (' + (d.gap < 0 ? '−' : '+') + money(Math.abs(d.gap)) + ')'; }).join(', ') + '.', {
      bullets: B.watch.map(function (w) { return w.text; }).concat(gone.length ? ['No orders at all from: ' + gone.join(', ')] : []),
      working: ['Normal day = average of the 28 days before ' + D + '.', 'Country gap = that country\'s revenue on ' + D + ' minus its own 28-day average.', 'Revenue = orders × average order value, so the two together explain the change.'],
      chips: ['Revenue by country yesterday', 'Cancellation rate this week'], asOf: asOf(B) });
  }

  function compareMonths(plan, B) {
    var m = plan.metric, f = MONTHLY_FIELD[m] || 'revenue', a = plan.compare[0], b = plan.compare[1];
    var ra = B.monthly.filter(function (x) { return x.month === a; })[0], rb = B.monthly.filter(function (x) { return x.month === b; })[0];
    if (!ra || !rb) return out('I keep monthly numbers from ' + monthName(B.monthly[0].month) + ' to ' + monthName(B.monthly[B.monthly.length - 1].month) + '; one of those months is outside that.', { asOf: asOf(B) });
    var fmt = m === 'margin' ? function (x) { return pct(x); } : (f === 'revenue' || f === 'aov' ? money : int);
    var later = a < b ? rb : ra, earlier = a < b ? ra : rb;
    var warn = (ra.partial || rb.partial) ? ' Careful: ' + monthName((ra.partial ? ra : rb).month) + ' is not finished yet (' + (ra.partial ? ra : rb).daysCovered + ' days), so this is not a fair comparison.' : '';
    return out(cap(label(m || 'revenue')) + was(m || 'revenue') + fmt(ra[f]) + ' in ' + monthName(a) + ' and ' + fmt(rb[f]) + ' in ' + monthName(b) + '. ' + monthName(later.month) + ' is ' + change(rel(later[f], earlier[f])) + ' on ' + monthName(earlier.month) + '.' + warn, {
      bullets: [ra, rb].map(function (r) { return monthName(r.month) + ': ' + money(r.revenue) + ' revenue, ' + int(r.orders) + ' orders, ' + money(r.aov) + ' average order'; }),
      working: ['Monthly totals from the Orders tab, cancelled orders excluded.'], asOf: asOf(B) });
  }

  function summary(B) {
    var k = B.kpis, D = B.dataDay;
    return out('On ' + dayName(D) + ' Apesv took ' + money(k.revenue.value) + ' from ' + int(k.orders.value) + ' orders, ' + changeWords(k.revenue.value, k.revenue.normal) + ' a normal day. Month to date revenue is ' + money(B.mtd.revenue) + ', ' + changeWords(B.mtd.revenue, B.mtd.lastMonthSameDays) + ' the same days last month.', {
      bullets: B.watch.map(function (w) { return w.area + ': ' + w.text; }), working: ['Pulled from this morning\'s checks and the watch list. Each line links to a section of the dashboard above.'],
      chips: ['Why was revenue down yesterday?', 'Can I trust today\'s numbers?'], asOf: asOf(B) });
  }

  function monthSummary(mk, B) {
    var r = B.monthly.filter(function (x) { return x.month === mk; })[0];
    if (!r) return out('I keep monthly numbers from ' + monthName(B.monthly[0].month) + ' to ' + monthName(B.monthly[B.monthly.length - 1].month) + ', and ' + monthName(mk) + ' is outside that.', { asOf: asOf(B) });
    var pr = B.monthly.filter(function (x) { return x.month === shiftMonth(mk, -1); })[0], ly = B.monthly.filter(function (x) { return x.month === shiftMonth(mk, -12); })[0];
    var fm = B.finance ? B.finance.months.filter(function (x) { return x.month === mk; })[0] : null;
    var t = monthName(mk) + ' brought ' + money(r.revenue) + ' from ' + int(r.orders) + ' orders' + (pr ? ', ' + changeWords(r.revenue, pr.revenue) + ' ' + monthName(pr.month).split(' ')[0] : '') + (ly ? ' and ' + changeWords(r.revenue, ly.revenue) + ' ' + monthName(ly.month) : '') + '.';
    if (fm) t += ' EBITDA was ' + money(fm.ebitda) + ' (' + pct(fm.ebitdaMarginPct) + ' of revenue).';
    return out(t, { bullets: ['Average order: ' + money(r.aov), 'Gross margin: ' + pct(r.grossMarginPct), 'Active customers: ' + int(r.activeCustomers), 'New customers: ' + int(r.newCustomers)],
      working: ['Monthly totals from the Orders tab, cancelled orders excluded.' + (fm ? ' EBITDA from the Finance_Monthly tab.' : '')], chips: ['Top categories in ' + monthName(mk).split(' ')[0], 'Revenue by country in ' + monthName(mk).split(' ')[0]], asOf: asOf(B) });
  }

  function health(B, payload) {
    var P = Analyst._payload || {};
    var checks = (P.health && P.health.checks) || [];
    var failed = checks.filter(function (c) { return !c.pass; });
    return out(failed.length ? 'Mostly yes, with ' + failed.length + ' warning' + (failed.length > 1 ? 's' : '') + ': ' + failed.map(function (c) { return c.detail; }).join(' ') : 'Yes. All ' + checks.length + ' checks passed this morning.', {
      bullets: (B.trustNotes || []), working: checks.map(function (c) { return (c.pass ? 'Passed: ' : 'Warning: ') + c.name + ' — ' + c.detail; }), asOf: asOf(B) });
  }

  // ---------- proof answers ----------
  var METRIC_SQL = { revenue: 'day', orders: 'day', aov: 'day', margin: 'day', cancel: 'cancel', delivery: 'carrier' };
  function model(plan, B) {
    var raw = String(plan.raw || '').toLowerCase();
    var id = /reconcil|finance/.test(raw) ? 'recon' : /normal day/.test(raw) ? 'normal' : /duplicate|repeated/.test(raw) ? 'dups' : /add up|adds up/.test(raw) ? 'money' : (plan.metric && METRIC_SQL[plan.metric]);
    if (id) {
      var s = Proof.sqlFor(id);
      var WHAT = { day: 'yesterday\'s revenue, orders, average order and gross margin', normal: 'a "normal day"', cancel: 'the cancellation rate', carrier: 'late deliveries by carrier', recon: 'the Orders vs Finance reconciliation', dups: 'the repeated-ID check', money: 'the money-adds-up check' };
      return out('Here is the SQL behind ' + WHAT[id] + '.', {
        code: s.sql, bullets: ['Checked: ' + s.verified], working: [Proof.SQL_NOTE],
        chips: ['Does revenue match the Finance tab?', 'Show me the data model', 'SQL for late deliveries'], asOf: asOf(B) });
    }
    if (plan.metric) return out('The SQL I have written out and checked covers revenue, orders, average order, gross margin, cancellations, late deliveries, the normal day and the Finance reconciliation. The ' + label(plan.metric) + ' numbers are worked out by the morning script from their own tab, using the definitions at the bottom of the page.', {
      chips: ['SQL for revenue', 'SQL for late deliveries', 'Show me the data model'], asOf: asOf(B) });
    return out('The data has 11 tabs. Orders is the centre: products, parcels and returns link to it by Order_ID, and the Finance tab is checked against it every month. Support tickets, website analytics, campaigns and HR are read on their own and never joined to orders.', {
      bullets: Proof.TABLES.map(function (t) { return t[0] + ': ' + t[1].toLowerCase() + ', linked by ' + t[2] + '. ' + t[3] + '.'; }),
      chips: ['SQL for revenue', 'Does revenue match the Finance tab?', 'What should I do today?'], asOf: asOf(B) });
  }
  function recon(plan, B) {
    var r = Proof.reconcile(B), P = Analyst._payload || {}, checks = (P.health && P.health.checks) || [];
    var passed = checks.filter(function (c) { return c.pass; }).length;
    var C = Proof.CROSS;
    var working = ['Reconciliation: added up revenue by month from the Orders tab (cancelled orders left out) and compared it with Net_Revenue_USD in the Finance_Monthly tab.',
      'Cross-check: ' + C.matched + ' of ' + C.checked + ' numbers matched (' + C.when + '). ' + C.how]
      .concat(Proof.DRILLS.map(function (d) { return 'Failure drill, ' + d[0].toLowerCase() + ': ' + d[1]; }));
    if (!r || !r.n) return out('The Finance tab could not be read this morning, so I can\'t reconcile revenue today. The other checks still ran: ' + passed + ' of ' + checks.length + ' passed.', { working: working, asOf: asOf(B) });
    var bad = r.rows.filter(function (x) { return !x.ok; });
    var text = bad.length ? 'Not fully. ' + bad.length + ' of ' + r.n + ' months differ: ' + bad.map(function (x) { return monthName(x.month) + ' (off by ' + moneyExact(x.diff) + ')'; }).join(', ') + '. Treat finance numbers for those months with care.'
      : 'Yes. Revenue from the Orders tab matches the Finance tab to the cent in all ' + r.n + ' months I can compare (' + monthName(r.rows[0].month) + ' to ' + monthName(r.rows[r.n - 1].month) + ').';
    text += ' This morning ' + passed + ' of ' + checks.length + ' data checks passed. Before launch, ' + C.matched + ' of ' + C.checked + ' numbers were cross-checked and ' + Proof.DRILLS.length + ' of ' + Proof.DRILLS.length + ' failure drills passed.';
    return out(text, {
      bullets: r.rows.slice(-6).map(function (x) { return monthName(x.month) + ': Orders tab ' + moneyExact(x.orders) + ', Finance tab ' + moneyExact(x.finance) + (x.ok ? ', match' : ', off by ' + moneyExact(x.diff)); }),
      working: working, chips: ['Can I trust today\'s numbers?', 'SQL for the Finance reconciliation', 'What should I do today?'], asOf: asOf(B) });
  }
  var AREA_OF = { revenue: 'Sales', orders: 'Orders', cancel: 'Orders', delivery: 'Delivery', margin: 'Margin', marketing: 'Marketing', profit: 'Finance' };
  function decide(plan, B) {
    var list = B.watch || [], area = plan.metric && AREA_OF[plan.metric];
    if (area) list = list.filter(function (w) { return w.area === area; });
    var extra = { note: 'I flag; you decide. I won\'t change prices, budgets or carriers, and I won\'t call one bad day a trend.', working: ['Alerts compare ' + dayName(B.dataDay) + ' with a normal day (the 28 days before).'].concat(Proof.REFUSED.map(function (r) { return 'Limit: ' + r; })), chips: ['Why was revenue down yesterday?', 'Does revenue match the Finance tab?', 'Which carrier is late most?'], asOf: asOf(B) };
    if (!list.length) return out(area ? 'Nothing in ' + area.toLowerCase() + ' crossed an alert line on ' + dayName(B.dataDay) + ', so there is no decision waiting there.' : 'Nothing crossed an alert line on ' + dayName(B.dataDay) + '. No decision is waiting.', extra);
    extra.bullets = list.map(function (w) { return w.area + ': ' + w.text + ' Decision it informs: ' + Proof.decisionFor(w); });
    return out((list.length === 1 ? 'One thing' : list.length + ' things') + ' from ' + dayName(B.dataDay) + ' may need a decision.', extra);
  }

  function help(B) {
    return out('Ask me about sales, orders, customers, marketing, delivery, returns, stock, support, profit or people. I understand days, weeks, months, "this month", "last 12 months", countries, product categories and sales channels. I can also show the SQL behind a number, the data model, whether revenue matches the Finance tab, and what decision each alert is for.', { chips: defaultChips(B), asOf: asOf(B) });
  }

  function askBack(B, plan) {
    return out('I\'m not sure which number you mean. Do you want revenue, orders, profit, or something else? Pick one below or add a word like "revenue" or "delivery".', { chips: ['Revenue this month', 'Orders yesterday', 'EBITDA last month', 'Late deliveries by carrier'], asOf: asOf(B), clarify: true });
  }

  function defaultChips(B) {
    return ['What\'s the latest update?', 'Why was revenue down yesterday?', 'Revenue in India last month', 'Top categories in the last 90 days', 'Which carrier is late most?', 'EBITDA in ' + monthName(B.finance && B.finance.lastFull ? B.finance.lastFull.month : B.dataDay.slice(0, 7)).split(' ')[0], 'Headcount by department', 'Compare August vs September', 'Can I trust today\'s numbers?', 'What should I do today?', 'Does revenue match the Finance tab?', 'Show me the SQL for revenue'];
  }

  return { parseQuestion: parseQuestion, answerPlan: answerPlan, ask: function (q, B) { var p = parseQuestion(q, B); var a = answerPlan(p, B); a.plan = p; return a; }, defaultChips: defaultChips, fmt: { money: money, moneyExact: moneyExact, pct: pct, int: int, change: change, dayName: dayName, monthName: monthName, addDays: addDays, shiftMonth: shiftMonth, rel: rel, changeWords: changeWords } };
})();
</script>

<script>
(function () {
  var DATA_URL = 'https://script.google.com/macros/s/AKfycbyS3-y308tfY2OSraycW8Gmj4lgDUCFmehngJhGidLpfRnWxXnjqfi46qPxAFok_kO6Xg/exec';
  var F = Analyst.fmt, money = F.money, pct = F.pct, int = F.int, rel = F.rel;
  var app = document.getElementById('app');
  var tip = document.getElementById('tip');
  var redraws = [];
  var P = null, B = null;

  // ---------- theme ----------
  var themeBtn = document.getElementById('themeBtn');
  try { var saved = localStorage.getItem('apesv-theme'); if (saved) document.documentElement.setAttribute('data-theme', saved); } catch (e) {}
  themeBtn.addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    var next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('apesv-theme', next); } catch (e) {}
  });

  // ---------- element helper (text is always set as text, never as HTML) ----------
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k];
      else if (k === 'cls') n.className = attrs[k];
      else if (k === 'style') n.setAttribute('style', attrs[k]);
      else if (k.indexOf('on') === 0) n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c === null || c === undefined || c === false) return; n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function svg(tag, attrs) { var n = document.createElementNS('http://www.w3.org/2000/svg', tag); Object.keys(attrs || {}).forEach(function (k) { if (k === 'style') n.setAttribute('style', attrs[k]); else n.setAttribute(k, attrs[k]); }); return n; }

  // ---------- tooltip ----------
  function showTip(evt, title, rows) {
    tip.textContent = '';
    tip.appendChild(el('div', { cls: 't-h', text: title }));
    rows.forEach(function (r) { tip.appendChild(el('div', { cls: 't-r' }, [el('span', { text: r[0] }), el('b', { text: r[1] })])); });
    tip.hidden = false;
    var x, y;
    if (evt && evt.clientX !== undefined && evt.type.indexOf('focus') < 0) { x = evt.clientX; y = evt.clientY; }
    else { var r = evt.target.getBoundingClientRect(); x = r.left + r.width / 2; y = r.top; }
    var w = tip.offsetWidth, h = tip.offsetHeight;
    var left = Math.min(window.innerWidth - w - 8, Math.max(8, x + 14));
    var top = y - h - 12 < 8 ? y + 16 : y - h - 12;
    tip.style.left = left + 'px'; tip.style.top = top + 'px';
  }
  function hideTip() { tip.hidden = true; }
  window.addEventListener('scroll', hideTip, { passive: true });

  // ---------- delta text ----------
  function delta(v, upIsBad, suffix) {
    if (v === null || v === undefined || isNaN(v)) return el('span', { cls: 'flat', text: 'n/a' });
    var p = Math.abs(v) * 100;
    if (p < 0.5) return el('span', { cls: 'flat', text: '● flat' + (suffix || '') });
    var up = v > 0, cls = up ? (upIsBad ? 'up-bad' : 'up-good') : (upIsBad ? 'down-good' : 'down-bad');
    return el('b', { cls: cls, text: (up ? '▲ ' : '▼ ') + (p >= 10 ? Math.round(p) : p.toFixed(1)) + '%' + (suffix || '') });
  }

  // ---------- card shell with "show table" ----------

  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && Date.now() - lastCheck > 30 * 60 * 1000) refresh(); });

  // 3. Work as a phone app: save the page for offline use, offer "Install app"
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
  var installEvt = null, installBtn = document.getElementById('installBtn');
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); installEvt = e; installBtn.hidden = false; });
  installBtn.addEventListener('click', function () { if (!installEvt) return; installEvt.prompt(); installEvt.userChoice.then(function () { installEvt = null; installBtn.hidden = true; }); });
  window.addEventListener('appinstalled', function () { installBtn.hidden = true; });
})();
</script>
